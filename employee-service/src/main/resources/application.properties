spring.application.name=employee-service
server.port=8081
spring.datasource.url=jdbc:h2:mem:employees;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
# The H2 web console has no login of its own and would expose the users table, so it stays off.
spring.h2.console.enabled=false

# Secrets come from employee-service/.env (git-ignored) or the JWT_SECRET environment variable.
# Both paths are listed so it also works when the service is started from the repository root.
spring.config.import=optional:file:.env[.properties],optional:file:employee-service/.env[.properties]
# Must be the same value in employee-service, payroll-service and ai-service. At least 32 characters.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=60
